name: Production Release Certification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  certify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: denis_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/denis_platform?schema=public
      JWT_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      SESSION_CAPABILITY_SECRET: ci-capability-secret-at-least-32-characters-long
      AI_FORCE_OFFLINE: 'true'
      AI_MEMORY_ENGINE: 'false'
      PAYMENT_DPO_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Policy
        run: npm run lint:ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Apply Migrations to Clean Database
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed and Run Security Regression
        working-directory: backend
        run: npx tsx prisma/seed.ts && npm run test:security

      - name: Build Production Artifacts
        run: npm run build

      - name: Verify Docker Builds
        run: docker compose config

      - name: Upload Certified Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            backend/dist
            frontend/dist
