services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: denis_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: denis_platform
      POSTGRES_USER: denis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Denis@Platform2025}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U denis -d denis_platform']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - denis_network

  # ─── Backend API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: denis_platform_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://denis:${POSTGRES_PASSWORD:-Denis@Platform2025}@postgres:5432/denis_platform
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@denischamkaga.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Denis@Platform2025}
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - denis_network
    profiles:
      - production

  # ─── pgAdmin (Dev Tool) ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: denis_platform_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL:-admin@denischamkaga.com}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Denis@Platform2025}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - denis_network
    profiles:
      - dev-tools

volumes:
  postgres_data:
    driver: local

networks:
  denis_network:
    driver: bridge
