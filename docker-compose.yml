services:
  # ─── Redis Cache & Job Queue ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: denis_platform_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - denis_network

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: denis_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: denis_platform
      POSTGRES_USER: denis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Denis@Platform2025}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U denis -d denis_platform']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - denis_network

  # ─── Backend API Node.js ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: denis_platform_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://denis:${POSTGRES_PASSWORD:-Denis@Platform2025}@postgres:5432/denis_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-denis-platform}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production-refresh-secret-denis-platform}
      FRONTEND_URL: ${FRONTEND_URL:-https://denischamkaga.com}
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - denis_network

  # ─── Nginx Reverse Proxy & Frontend Host ───────────────────────────────────
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: denis_platform_web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    networks:
      - denis_network

volumes:
  postgres_data:
    driver: local

networks:
  denis_network:
    driver: bridge
