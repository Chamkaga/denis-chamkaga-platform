<!doctype html>
<html lang="en">
  <head>

    <!-- Favicon -->

    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Default Page Title (overridden per route by PageTitle component) -->
    <title>Denis Chamkaga | Web Software Developer</title>

    <!-- Default SEO Meta Tags -->
    <meta name="description" content="Denis Chamkaga is a Business Information Technology graduate, Web Software Developer and lifelong learner based in Tanzania. He builds practical software solutions that help businesses simplify operations." />

    <meta name="author" content="Denis Chamkaga" />
    <meta name="application-name" content="Denis Chamkaga" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://denischamkaga.com/" />
    <meta property="og:title" content="Denis Chamkaga | Web Software Developer" />
    <meta property="og:description" content="Business IT graduate helping SMEs simplify operations, improve efficiency and build practical software solutions in Tanzania." />
    <meta property="og:image" content="https://denischamkaga.com/images/hero/portrait.webp" />
    <meta property="og:site_name" content="Denis Chamkaga" />
    <meta property="og:locale" content="en_TZ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Denis Chamkaga | Web Software Developer" />
    <meta name="twitter:description" content="Business IT graduate helping SMEs simplify operations and build practical software solutions in Tanzania." />
    <meta name="twitter:image" content="https://denischamkaga.com/images/hero/portrait.webp" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#8b5cf6" />
    <script src="/theme-init.js"></script>
